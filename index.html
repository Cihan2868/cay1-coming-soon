<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çay1 - Yakında Hizmetinizde</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FDF5E6; /* Warmes Creme */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            color: #4A2C2A; /* Dunkles Braun */
        }
        .container {
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
        }
        .logo {
            font-size: 3rem;
            font-weight: bold;
            color: #C0392B; /* Tee-Rot */
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .footer {
            font-size: 0.9rem;
            color: #999;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">☕ Çay1</div>
        <h1>Yakında Hizmetinizde</h1>
        <p>Geleneksel çay kültürünü modern teknolojiyle buluşturuyoruz. Çok yakında sizlerle!</p>
        <div class="footer">
            &copy; 2026 Çay1. Tüm hakları saklıdır. | cay1.com.tr
        </div>
    </div>
</body>
</html>
