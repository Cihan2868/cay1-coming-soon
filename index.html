<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çay1 - Yakında Hizmetinizde</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FDF5E6; /* Warmes Creme */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            color: #4A2C2A; /* Dunkles Braun */
        }
        .container {
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
        }
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .logo-text {
            font-size: 3rem;
            font-weight: bold;
            color: #C0392B; /* Tee-Rot */
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .footer {
            font-size: 0.9rem;
            color: #999;
            margin-top: 40px;
        }
        /* SVG Styling */
        .tea-glass {
            width: 60px;
            height: 80px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <!-- Türkisches Teeglas als SVG -->
            <svg class="tea-glass" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                <!-- Untertasse -->
                <ellipse cx="50" cy="105" rx="45" ry="12" fill="#F0F0F0" stroke="#D0D0D0" stroke-width="3"/>
                <ellipse cx="50" cy="105" rx="30" ry="8" fill="#E8E8E8"/>
                <!-- Glas (Tulpenform) -->
                <path d="M 25 85 Q 15 40 35 15 L 65 15 Q 85 40 75 85 Z" fill="rgba(255, 255, 255, 0.5)" stroke="#D0D0D0" stroke-width="2"/>
                <!-- Tee (Flüssigkeit) -->
                <path d="M 30 78 Q 22 45 38 22 L 62 22 Q 78 45 70 78 Z" fill="#8B2500" />
                <!-- Tee-Schaum/Bläschen -->
                <circle cx="45" cy="28" r="3" fill="#D2691E" />
                <circle cx="55" cy="35" r="2" fill="#D2691E" />
                <circle cx="50" cy="25" r="1.5" fill="#D2691E" />
                <!-- Lichtreflex auf dem Glas -->
                <path d="M 35 30 Q 30 50 33 75" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <div class="logo-text">Çay1</div>
        </div>
        <h1>Yakında Hizmetinizde</h1>
        <p>Geleneksel çay kültürünü modern teknolojiyle buluşturuyoruz. Çok yakında sizlerle!</p>
        <div class="footer">
            &copy; 2026 Çay1. Tüm hakları saklıdır. | cay1.com.tr
        </div>
    </div>
</body>
</html>
