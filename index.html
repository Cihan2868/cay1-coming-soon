<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çay1 - Yakında Hizmetinizde</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FDF5E6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: #4A2C2A;
        }
        .container {
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 450px;
            width: 90%;
            margin: 20px;
        }
        .logo-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: #C0392B;
            margin-bottom: 15px;
        }
        .hero-image {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.6;
            font-weight: 500;
        }
        .footer {
            font-size: 0.9rem;
            color: #999;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-text">Çay1</div>
        
        <!-- Dein neues Banner-Bild -->
        <img src="cay1-banner.jpg" alt="Çay1 Ürünleri" class="hero-image">
        
        <!-- Dein neuer Text -->
        <h1>Biraz Sabır, Hazırlanıyoruz</h1>
        <p>Artık Çaylarınızı, sıcak ve soğuk içeceklerinizi, hatta Simit ve Böreklerinizi ışık hızında sipariş edebileceksiniz.</p>
        
        <div class="footer">
            &copy; 2026 Çay1. Tüm hakları saklıdır. | cay1.com.tr
        </div>
    </div>
</body>
</html>
